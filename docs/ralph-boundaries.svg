<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 930" role="img" aria-labelledby="title desc"><title id="title">Ralph execution boundaries</title><desc id="desc">Shell-enforced state and loop operations contrasted with prompt-requested quality checks and commits. Credits and license limits included.</desc><rect width="1100" height="930" fill="white"/><g font-family="Arial, sans-serif"><text x="30" y="52.0" font-size="30" fill="#172b4d">Ralph: execution boundaries</text><text x="30" y="85.0" font-size="18" fill="#172b4d">Source-backed explanation • not a sandbox or completion guarantee</text><text x="30" y="127.0" font-size="17" fill="#245846">SHELL IMPLEMENTATION</text><text x="570" y="127.0" font-size="17" fill="#765418">PROMPT-REQUESTED BEHAVIOR</text><rect x="30" y="148" width="500" height="148" fill="#e8f3ed" stroke="#172b4d"/><text x="48" y="183.0" font-size="21" fill="#172b4d">1  Prepare script-local state</text><text x="48" y="214.0" font-size="17" fill="#172b4d">prd.json / progress.txt / .last-branch</text><text x="48" y="236.1" font-size="17" fill="#172b4d">Branch-name change: copy current state</text><text x="48" y="258.2" font-size="17" fill="#172b4d">to dated archive; reset progress.</text><rect x="570" y="148" width="500" height="148" fill="#fff3d9" stroke="#172b4d"/><text x="588" y="183.0" font-size="21" fill="#172b4d">A  Select and implement</text><text x="588" y="214.0" font-size="17" fill="#172b4d">Read PRD + progress; select branch.</text><text x="588" y="236.1" font-size="17" fill="#172b4d">Choose one highest-priority story.</text><text x="588" y="258.2" font-size="17" fill="#172b4d">Implement it and update learnings.</text><path d="M280 302v28m-6 -8 6 8 6 -8" fill="none" stroke="#172b4d" stroke-width="2"/><path d="M820 302v28m-6 -8 6 8 6 -8" fill="none" stroke="#172b4d" stroke-width="2"/><rect x="30" y="338" width="500" height="148" fill="#e8f3ed" stroke="#172b4d"/><text x="48" y="373.0" font-size="21" fill="#172b4d">2  Invoke fresh Amp each iteration</text><text x="48" y="404.0" font-size="17" fill="#172b4d">Prompt piped over stdin. CWD unchanged.</text><text x="48" y="426.1" font-size="17" fill="#172b4d">--dangerously-allow-all; billable usage.</text><text x="48" y="448.2" font-size="17" fill="#172b4d">Invocation errors tolerated (|| true).</text><rect x="570" y="338" width="500" height="148" fill="#fff3d9" stroke="#172b4d"/><text x="588" y="373.0" font-size="21" fill="#172b4d">B  Check and record</text><text x="588" y="404.0" font-size="17" fill="#172b4d">Run project checks + UI verification.</text><text x="588" y="426.1" font-size="17" fill="#172b4d">Commit only if checks pass; set passes.</text><text x="588" y="448.2" font-size="17" fill="#172b4d">Append progress and request completion.</text><path d="M280 492v28m-6 -8 6 8 6 -8" fill="none" stroke="#172b4d" stroke-width="2"/><path d="M820 492v28m-6 -8 6 8 6 -8" fill="none" stroke="#172b4d" stroke-width="2"/><rect x="30" y="528" width="500" height="148" fill="#e8f3ed" stroke="#172b4d"/><text x="48" y="563.0" font-size="21" fill="#172b4d">3  Inspect output marker</text><text x="48" y="594.0" font-size="17" fill="#172b4d">COMPLETE marker =&gt; exit 0. Otherwise</text><text x="48" y="616.1" font-size="17" fill="#172b4d">repeat (default limit 10); then exit 1.</text><text x="48" y="638.2" font-size="17" fill="#172b4d">No independent story/test verification.</text><rect x="570" y="528" width="500" height="148" fill="#fff3d9" stroke="#172b4d"/><text x="588" y="563.0" font-size="21" fill="#172b4d">Boundary: instructions are not gates</text><text x="588" y="594.0" font-size="17" fill="#172b4d">Shell does not enforce branch policy,</text><text x="588" y="616.1" font-size="17" fill="#172b4d">passing tests, review or truthful status.</text><text x="588" y="638.2" font-size="17" fill="#172b4d">React presentation runs none of this.</text><text x="30" y="733.0" font-size="23" fill="#172b4d">Before intentional execution</text><text x="30" y="768.0" font-size="18" fill="#172b4d">Resolve copied prompt paths vs. script-local state; review permissions, billing and recovery.</text><text x="30" y="791.4" font-size="18" fill="#172b4d">Keep secrets/private context out of shared logs, archives and agent thread links.</text><text x="30" y="843.0" font-size="16" fill="#172b4d">Credits: Ryan Carson implementation; Geoffrey Huntley pattern; JD-attributed CI/ref delta.</text><text x="30" y="863.8" font-size="16" fill="#172b4d">Schematic: Reason-assisted documentation. Inherited code/artwork rights unresolved.</text><text x="30" y="900.0" font-size="14" fill="#172b4d">Source baseline: 545e1ed4580e147c742bd4d831550bb3ca3da674 • ralph.sh + prompt.md</text></g></svg>
